<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapAway</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="panel"><header><div><p class="eyebrow">SNAPAWAY</p><h1>Pixel vanish</h1></div><span id="statusDot" class="status-dot ready"></span></header><p id="context" class="context">Local camera studio</p><label class="switch-row"><span>Enable extension</span><input id="enabled" type="checkbox" checked><span class="switch"></span></label><button id="openStudio" class="primary">Open camera studio</button><button id="trigger" class="secondary">Trigger studio effect</button><button id="restore" class="secondary">Restore video</button><div class="controls"><label><span>Particle intensity <output id="intensityValue">70</output></span><input id="intensity" type="range" min="20" max="100" value="70"></label><label><span>Duration <output id="durationValue">2.8s</output></span><input id="duration" type="range" min="1200" max="5000" step="100" value="2800"></label></div><p id="message" class="message">Segmentation and snap detection run locally.</p><footer>Step 2 · local vision prototype</footer></main><script type="module" src="popup.js"></script></body></html>
